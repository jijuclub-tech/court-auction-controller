<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIDGUARD · 탐색자료 관리</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#192f4c;font:19px system-ui,"Malgun Gothic",sans-serif}
header{background:#0a2746;color:white;padding:22px 28px;font-size:28px;font-weight:750}
header a{float:right;color:#fff;text-decoration:none;font-size:18px}
main{max-width:960px;margin:auto;padding:26px 17px}
h1{font-size:33px;margin:0 0 25px}h2{font-size:25px;margin:0 0 16px}
section{background:#fff;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 5px 19px #17385a0d}
button,input{font:19px system-ui,"Malgun Gothic",sans-serif;min-height:52px;border-radius:11px;padding:10px 15px}
button{border:0;background:#143a62;color:white;cursor:pointer;font-weight:750}
button.soft{background:#e7eef6;color:#143a62}input{border:1px solid #c4d0dd;width:100%}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row>*{flex:1}
.item{border-top:1px solid #e4e9ef;padding:17px 0}.item:first-child{border:0}
.item strong{font-size:21px;display:block}.item p{margin:10px 0;color:#49677f;font-size:18px}
.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{flex:1;min-width:115px}
#notice{min-height:28px;color:#195d8c;font-size:19px}
@media(max-width:550px){header a{display:block;float:none;padding-top:9px}section{padding:19px}.row>*{flex-basis:100%}h1{font-size:30px}}
</style></head><body><header>BIDGUARD <a href="/admin">관제탑</a></header><main>
<h1>사이트 탐색자료</h1>
<section><h2>관리자 연결</h2><div class="row"><input type="password" id="token" autocomplete="off" placeholder="관리자 인증">
<button id="connect">연결</button><button id="refresh" class="soft">새로고침</button></div></section>
<section><h2>검토 대기</h2><div id="pending">연결 후 표시됩니다.</div></section>
<section><h2>배포 중인 자료</h2><div id="active">등록된 자료가 없습니다.</div></section>
<div id="notice" role="status"></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let token='';
async function req(url,body){const res=await fetch(url,{method:body?'POST':'GET',
headers:{'Content-Type':'application/json','X-Admin-Token':token},cache:'no-store',
...(body?{body:JSON.stringify(body)}:{})});const j=await res.json();
if(!res.ok||!j.ok)throw Error(j.error||'연결을 확인하세요');return j}
async function change(id,action){try{await req('/api/admin/exploration/decision',{proposal_id:id,action});
$('notice').textContent=action==='approve'?'승인되었습니다':'반려되었습니다';await load()}
catch(e){$('notice').textContent=e.message}}
async function load(){if(!token)return $('notice').textContent='관리자 연결이 필요합니다';
try{const j=await req('/api/admin/exploration/state');$('notice').textContent='연결됨';
const pending=$('pending');pending.replaceChildren();
if(!j.pending.length)pending.textContent='검토 대기 없음';
(j.pending||[]).forEach(p=>{const e=document.createElement('article');e.className='item';
const t=document.createElement('strong');t.textContent=p.site_id+' · '+p.collector;
const d=document.createElement('p');d.textContent=(p.navigation||{}).page_kind+' · '+(p.navigation||{}).url;
const b=document.createElement('div');b.className='actions';
[['승인','approve'],['반려','reject']].forEach(([label,act])=>{
const btn=document.createElement('button');btn.textContent=label;btn.className=act==='reject'?'soft':'';
btn.onclick=()=>change(p.proposal_id,act);b.append(btn)});
e.append(t,d,b);pending.append(e)});
const active=$('active');active.replaceChildren();
if(!j.latest.length)active.textContent='배포 중인 자료가 없습니다';
(j.latest||[]).forEach(x=>{const a=document.createElement('article');a.className='item';
const b=document.createElement('strong');b.textContent=x.site_id+' · '+x.version+'판';
a.append(b);active.append(a)})}catch(e){$('notice').textContent=e.message}}
$('connect').onclick=()=>{token=$('token').value.trim();$('token').value='';load()};
$('refresh').onclick=load;
})();
</script></body></html>
