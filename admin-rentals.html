<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIDGUARD · 수집기 관제</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#15263d;font:19px system-ui,"Noto Sans KR",sans-serif}
header{background:#0c2749;color:white;padding:21px 30px;font-size:29px;font-weight:800}
main{max-width:1120px;margin:auto;padding:28px 18px}h1{font-size:35px;margin:5px 0 25px}h2{font-size:26px;margin:0 0 18px}
section{background:#fff;border-radius:17px;padding:24px;margin-bottom:18px;box-shadow:0 3px 18px #20365512}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
input,select,button{min-height:52px;padding:10px 15px;border-radius:12px;font-size:18px}
input{border:1px solid #c9d4e0;width:100%}button{border:0;cursor:pointer;background:#18395f;color:white;font-weight:750}
button.light{background:#e6edf5;color:#254360}button:disabled{opacity:.45}
article{border-top:1px solid #e5ebf0;padding:17px 0}article:first-child{border:0}
article strong{display:block;font-size:21px;margin-bottom:8px}article .row{justify-content:flex-start}
article button{flex:0 1 auto}.sub{color:#526b84;font-size:18px;margin:9px 0}
#notice{min-height:28px;color:#185f86}code{word-break:break-all;display:block;padding:14px;background:#eef4fa;border-radius:10px;margin:12px 0;font-size:17px}
@media(max-width:590px){.row>*{flex-basis:100%}header{font-size:24px}h1{font-size:29px}section{padding:18px}}
</style></head><body><header>BIDGUARD</header><main><h1>수집기 관제</h1>
<section><h2>관리자 연결</h2><div class="row"><input id="token" type="password" autocomplete="off" placeholder="관리자 인증"><button id="connect">연결</button><button id="refresh" class="light">새로고침</button></div><p id="notice" role="status"></p></section>
<section><h2>수집기 현황</h2><div id="nodes">관리자 연결 후 표시됩니다.</div></section>
<section><h2>임대 배정 우선순위</h2><div class="row"><select id="priorityNode" style="flex:2"></select><input id="priorityValue" type="number" min="0" max="100" value="0" aria-label="우선순위"><button id="savePriority">저장</button></div></section>
<section><h2>임대 작업</h2><div id="jobs">작업 내역이 없습니다.</div></section>
<section><h2>회원 이용코드</h2><div class="row"><input id="member" placeholder="회원 식별자" autocomplete="off"><button id="issue">발급</button></div><div id="issued" role="status"></div></section>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);
let token='',status={AWAITING_APPROVAL:'승인 대기',PENDING:'배정 대기',LEASED:'배정됨',RUNNING:'수집 중',PAUSE_REQUESTED:'일시정지 요청',PAUSED:'일시정지',RESUME_QUEUED:'복귀 대기',RECOVERY_REQUIRED:'복구 확인 필요',DONE:'완료',FAILED:'확인 필요',CANCELLED:'취소'};
async function request(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'X-Admin-Token':token,'Content-Type':'application/json'},
body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'처리 실패');return j}
async function refresh(){if(!token)return $('notice').textContent='관리자 연결이 필요합니다';
try{const [state,rental]=await Promise.all([request('/api/admin/state'),request('/api/admin/rentals')]);
$('notice').textContent='연결됨';let nodes=$('nodes');nodes.replaceChildren();
const selected=$('priorityNode').value;const select=$('priorityNode');select.replaceChildren();
(state.collectors||[]).filter(n=>n.type==='control').forEach(n=>select.add(new Option(n.name,n.name)));
if([...select.options].some(o=>o.value===selected))select.value=selected;
$('priorityValue').value=(rental.priority||{})[select.value]||0;
(state.collectors||[]).forEach(n=>{const e=document.createElement('article'),name=document.createElement('strong'),detail=document.createElement('div');
name.textContent=n.name;detail.textContent=(n.status==='approved'?'정상 등록':n.status==='pending'?'승인 대기':'차단')+' · '+(n.last_seen||'접속 이력 없음');detail.className='sub';e.append(name,detail);nodes.append(e)});
if(!(state.collectors||[]).length)nodes.textContent='등록된 수집기가 없습니다.';
let jobs=$('jobs');jobs.replaceChildren();(rental.jobs||[]).forEach(j=>{const e=document.createElement('article'),name=document.createElement('strong'),detail=document.createElement('p'),actions=document.createElement('div');
name.textContent=j.member_id+' · '+j.route_id;
detail.className='sub';detail.textContent=(status[j.status]||j.status)+(j.collector?' · '+j.collector:'');
actions.className='row';
const transitions={AWAITING_APPROVAL:['approve','cancel'],PENDING:['pause','cancel'],LEASED:['pause'],
RUNNING:['pause'],PAUSED:['resume','cancel'],RESUME_QUEUED:['pause','cancel'],RECOVERY_REQUIRED:['review_resume']};
const names={approve:'승인',pause:'일시정지',resume:'복귀 요청',review_resume:'복구 확인 후 재배정',cancel:'취소'};
(transitions[j.status]||[]).forEach(action=>{const b=document.createElement('button');b.className='light';b.textContent=names[action];
b.onclick=async()=>{try{await request('/api/admin/rentals/change',{job_id:j.job_id,action});refresh()}catch(err){$('notice').textContent=err.message}};
actions.append(b)});e.append(name,detail,actions);jobs.append(e)});
if(!(rental.jobs||[]).length)jobs.textContent='접수된 임대 작업이 없습니다.';
}catch(e){$('notice').textContent=e.message}}
$('connect').onclick=()=>{token=$('token').value.trim();$('token').value='';refresh()};
$('refresh').onclick=refresh;
$('priorityNode').onchange=()=>{$('priorityValue').value=0;refresh()};
$('savePriority').onclick=async()=>{
 try{await request('/api/admin/rentals/priority',{name:$('priorityNode').value,
 priority:Number($('priorityValue').value)});$('notice').textContent='저장되었습니다';refresh()}
 catch(e){$('notice').textContent=e.message}};
$('issue').onclick=async()=>{if(!token)return $('notice').textContent='관리자 연결이 필요합니다';
try{const m=await request('/api/admin/rentals/member',{member_id:$('member').value.trim()});
let out=$('issued');out.replaceChildren();const title=document.createElement('p');title.textContent='회원에게 안전한 방법으로 전달해 주세요.';
const c=document.createElement('code');c.textContent=m.access_code;
const b=document.createElement('button');b.textContent='코드 복사';b.onclick=()=>navigator.clipboard.writeText(m.access_code);
out.append(title,c,b)}catch(e){$('notice').textContent=e.message}};
setInterval(()=>{if(token&&!document.hidden)refresh()},20000);
})();
</script></body></html>
