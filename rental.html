<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIDGUARD · 온라인 수집기</title>
<style>
:root{font-family:system-ui,"Noto Sans KR",sans-serif;color:#14263d;background:#f6f8fc}
*{box-sizing:border-box}body{margin:0}header{background:#0b2240;color:#fff;padding:22px clamp(20px,5vw,60px)}
header strong{letter-spacing:.1em;font-size:30px}header nav{float:right;padding-top:8px}
header a{color:#d9e9ff;text-decoration:none;font-size:18px}
main{max-width:1020px;margin:auto;padding:30px 20px 80px}h1{font-size:clamp(30px,5vw,46px);margin:2px 0 30px;letter-spacing:-.035em}h2{font-size:26px;margin:0 0 22px}section{background:#fff;border-radius:22px;padding:28px;margin-bottom:20px;box-shadow:0 5px 25px #132d4a0b}label{display:block;font-size:19px;font-weight:700;margin:16px 0 10px}input,select,textarea{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:12px;padding:16px;font-size:19px;color:#14263d;min-height:56px}textarea{min-height:104px;resize:vertical}
button{border:0;border-radius:14px;min-height:54px;padding:12px 20px;font-weight:750;font-size:19px;cursor:pointer;background:#102b50;color:#fff}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.55;cursor:not-allowed}
button.secondary{background:#eaf1f8;color:#173956}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.pill{display:inline-block;padding:8px 14px;border-radius:40px;background:#e7f2ff;color:#19528e;font-size:17px}.card{padding:18px 0;border-bottom:1px solid #e5e9f0}.card:last-child{border-bottom:0}.card strong{font-size:21px}.card p{font-size:18px;color:#43627e;margin:10px 0}
#notice{min-height:28px;font-size:18px;color:#205d8f;margin:10px 0}.hidden{display:none}
footer{display:flex;justify-content:center;gap:17px;flex-wrap:wrap;padding:36px 20px;border-top:1px solid #d9e0e9}
footer a{color:#415d7b;text-decoration:none;font-size:18px}
@media(max-width:640px){main{padding:22px 14px 55px}section{padding:22px 18px}header strong{font-size:25px}header nav{float:none;margin-top:12px}h2{font-size:24px}.row>*{flex-basis:100%}}
</style></head><body>
<header><strong>BIDGUARD</strong><nav><a href="https://jijuclub.com">서비스 홈</a></nav></header>
<main><h1>온라인 수집기</h1>
<section id="auth"><h2>회원 연결</h2>
<label for="code">회원 이용코드</label><input id="code" type="password" autocomplete="off" placeholder="이용코드를 입력하세요">
<div class="row" style="margin-top:16px"><button id="login">연결하기</button><button id="logout" class="secondary">연결 해제</button></div></section>
<section><h2>수집 신청</h2>
<label for="route">사이트 · 작업 선택</label><select id="route"><option value="">작업을 선택하세요</option></select>
<div class="row"><button id="addfav" class="secondary">즐겨찾기 등록</button><button id="favs" class="secondary">즐겨찾기 보기</button></div>
<div id="favoritePanel" class="hidden"></div>
<label for="mode">작업 유형</label><select id="mode"><option value="one_time">1회 수집</option><option value="reserved">예약 수집</option></select>
<div id="hoursPanel" class="hidden"><label for="hours">예약시간</label><select id="hours">
<option value="1">1시간</option><option value="3">3시간</option><option value="6">6시간</option><option value="12">12시간</option>
</select></div>
<label for="note">작업 요청</label><textarea id="note" maxlength="240" placeholder="예: 신규 경매물건을 확인해 줘"></textarea>
<button id="apply" style="width:100%;margin-top:20px">수집 신청</button>
<div id="notice" role="status"></div></section>
<section><div class="row"><h2 style="margin:0">내 작업</h2><button id="refresh" class="secondary">새로고침</button></div><div id="jobs" style="margin-top:20px" aria-live="polite">신청 내역이 없습니다.</div></section>
<section><button class="secondary" id="help">이용 안내</button><div id="helpContent" class="hidden" style="font-size:18px;line-height:1.7;margin-top:16px">
온라인 임대형은 1회성 자료 수집에 적합합니다. 예약 수집은 최대 12시간까지 신청할 수 있습니다. 작업은 상황에 따라 일시정지되고 복귀까지 시간이 걸릴 수 있습니다. 별도 프로그램 설치가 필요한 반복 감시는 독립 설치형을 이용해 주세요.
</div></section></main>
<footer><a href="https://game.jijuclub.com">게임</a><a href="https://collect.jijuclub.com">수집기</a><a href="https://bidguard.jijuclub.com">경매</a><a href="https://shopping.jijuclub.com">쇼핑</a><a href="https://phone.jijuclub.com">전화</a><a href="https://book.jijuclub.com">도서</a><a href="https://ambition.jijuclub.com">AMBITION</a></footer>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),status={
AWAITING_APPROVAL:'접수 완료',PENDING:'배정 대기',LEASED:'배정됨',RUNNING:'수집 중',
PAUSE_REQUESTED:'일시정지 중',PAUSED:'일시정지',RESUME_QUEUED:'복귀 대기',
DONE:'작업 완료',FAILED:'작업 확인 필요',CANCELLED:'취소됨'};
let token='', routes=[];
const show=(text)=>{$('notice').textContent=text};
async function req(url,opts={}){
 const h={'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{}),...(opts.headers||{})};
 const r=await fetch(url,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined,cache:'no-store'});
 const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'처리할 수 없습니다');return j;
}
async function catalog(){
 try{const r=await req('/api/rentals/catalog');routes=r.routes||[];const select=$('route');
 select.replaceChildren(new Option('작업을 선택하세요',''));
 routes.forEach(x=>select.add(new Option(x.name,x.route_id)));
 }catch(e){show('작업 목록을 불러올 수 없습니다')}
}
async function load(){
 if(!token){$('jobs').textContent='회원 연결 후 확인할 수 있습니다.';return}
 try{const r=await req('/api/rentals/jobs');const out=$('jobs');out.replaceChildren();
 if(!r.jobs.length){out.textContent='신청 내역이 없습니다.';return}
 r.jobs.forEach(j=>{const d=document.createElement('div');d.className='card';
 const title=document.createElement('strong');title.textContent=(routes.find(x=>x.route_id===j.route_id)||{}).name||j.route_id;
 const p=document.createElement('p');p.textContent=(status[j.status]||'확인 중')+(j.checkpoint?' · '+j.checkpoint+'단계 진행':'');
 d.append(title,p);out.append(d)});
 }catch(e){$('jobs').textContent='회원 연결을 확인해 주세요.'}
}
async function favs(){
 if(!token)return show('회원 연결 후 이용해 주세요');
 try{const r=await req('/api/rentals/favorites');const panel=$('favoritePanel');panel.replaceChildren();
 if(!r.favorites.length)panel.textContent='등록된 즐겨찾기가 없습니다.';
 r.favorites.forEach(id=>{const row=document.createElement('div');row.className='row card';
 const b=document.createElement('button');b.className='secondary';b.textContent=(routes.find(x=>x.route_id===id)||{}).name||id;
 b.onclick=()=>{$('route').value=id;panel.classList.add('hidden')};
 const del=document.createElement('button');del.className='secondary';del.textContent='삭제';
 del.onclick=async()=>{await req('/api/rentals/favorites',{method:'POST',body:{route_id:id,action:'remove'}});favs()};
 row.append(b,del);panel.append(row)});
 panel.classList.remove('hidden');
 }catch(e){show(e.message)}
}
$('login').onclick=async()=>{const next=$('code').value.trim();if(!next)return show('이용코드를 입력해 주세요');
 token=next;try{await req('/api/rentals/jobs');$('code').value='';show('연결되었습니다');await load()}catch(e){token='';show('이용코드를 확인해 주세요')}};
$('logout').onclick=()=>{token='';$('jobs').textContent='연결이 해제되었습니다.';show('연결 해제 완료')};
$('mode').onchange=()=>{$('hoursPanel').classList.toggle('hidden',$('mode').value!=='reserved')};
$('apply').onclick=async()=>{if(!token)return show('회원 연결 후 신청해 주세요');if(!$('route').value)return show('작업을 선택해 주세요');
 try{await req('/api/rentals/jobs',{method:'POST',body:{route_id:$('route').value,mode:$('mode').value,
 hours:parseInt($('hours').value,10),note:$('note').value}});
 show('수집 신청이 접수되었습니다');$('note').value='';await load()}catch(e){show(e.message)}};
$('refresh').onclick=load;
$('addfav').onclick=async()=>{if(!token)return show('회원 연결 후 이용해 주세요');if(!$('route').value)return show('작업을 선택해 주세요');
 try{await req('/api/rentals/favorites',{method:'POST',body:{route_id:$('route').value,action:'add'}});show('즐겨찾기에 등록했습니다')}
 catch(e){show(e.message)}};
$('favs').onclick=favs;$('help').onclick=()=>$('helpContent').classList.toggle('hidden');
catalog().then(load);setInterval(()=>{if(!document.hidden&&token)load()},20000);
})();
</script></body></html>
