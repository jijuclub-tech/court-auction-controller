<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Bidguard Controller{% endblock %} · 관제기</title>
<style>
:root{
  --bg:#f3f6f4; --card:#ffffff; --line:#e3e9e5; --text:#1f2a24; --muted:#6b7a71;
  --brand:#167a4a; --brand-dark:#0f5c37; --brand-soft:#e6f4ec;
  --ok-bg:#e3f6ea; --ok-text:#11623a; --err-bg:#fdecec; --err-text:#a12a2a;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.55}
a{color:var(--brand)}
/* 상단 메뉴 */
.topbar{background:var(--brand-dark);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.topbar-inner{max-width:1100px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.3px;color:#fff;text-decoration:none;margin-right:6px}
.logo span{opacity:.7;font-weight:500;font-size:.85em;margin-left:4px}
.menu{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.menu a{color:#e5f3eb;text-decoration:none;padding:6px 12px;border-radius:999px;font-size:.93em}
.menu a:hover{background:rgba(255,255,255,.12)}
.menu a.on{background:#fff;color:var(--brand-dark);font-weight:700}
.side{display:flex;gap:8px;align-items:center;font-size:.85em}
.side a{color:#cfe8da;text-decoration:none}
.side .logout{border:1px solid rgba(255,255,255,.5);padding:5px 12px;border-radius:999px;color:#fff}
.side .logout:hover{background:rgba(255,255,255,.12)}
/* 본문 */
main{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:1.45em;margin:4px 0 4px}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin:0 0 18px;
  box-shadow:0 1px 3px rgba(16,40,28,.04)}
.card h2{font-size:1.08em;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.count{background:var(--brand-soft);color:var(--brand-dark);border-radius:999px;padding:1px 10px;font-size:.85em;font-weight:700}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
/* 알림 배지 */
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 16px;margin:0 0 16px;font-weight:600;animation:pop .25s ease-out}
.alert.ok{background:var(--ok-bg);color:var(--ok-text);border:1px solid #bfe6cd}
.alert.error{background:var(--err-bg);color:var(--err-text);border:1px solid #f3c4c4}
.alert .icon{font-size:1.1em;line-height:1.3}
@keyframes pop{from{transform:translateY(-4px)}to{transform:none}}
/* 입력 */
form .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 200px;margin-bottom:12px}
.field.wide{flex-basis:100%}
.field label{font-size:.86em;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;padding:9px 12px;border:1px solid #cfd9d3;border-radius:10px;background:#fbfdfc;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,122,74,.15);background:#fff}
textarea{resize:vertical}
.btn{font:inherit;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:700;cursor:pointer;margin-bottom:12px}
.btn:hover{background:var(--brand-dark)}
.hint{color:var(--muted);font-size:.86em;margin:2px 0 0}
/* 목록 표 */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px}
th{background:#f6f9f7;color:var(--muted);font-size:.84em;text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.new td{background:#f1fbf5}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.82em;font-weight:700;background:#eef2f0;color:#44524a}
.tag.control{background:#e3effd;color:#1d4f91}
.tag.supply{background:#fff3df;color:#8a5a0b}
.tag.wait{background:#fff6dd;color:#86600a}
.tag.done{background:var(--ok-bg);color:var(--ok-text)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:.9em}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;border:1px dashed #cfd9d3;border-radius:12px;background:#fafcfb}
.empty b{display:block;color:var(--text);margin-bottom:4px}
/* 홈 숫자 카드 */
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;text-decoration:none;color:inherit}
.stat:hover{border-color:var(--brand)}
.stat .n{font-size:1.8em;font-weight:800;color:var(--brand-dark)}
.stat .l{color:var(--muted);font-size:.88em}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;margin:0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-weight:600;word-break:break-all}
@media (max-width:640px){
  .topbar-inner{padding:10px 12px}
  main{padding:16px 12px 50px}
  .card{padding:16px}
  .menu a{padding:5px 10px}
}
</style>
{% block head %}{% endblock %}
</head>
<body>
{% include 'base_nav.html' %}
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, m in messages %}
      <div class="alert {{ 'error' if cat == 'error' else 'ok' }}" role="status">
        <span class="icon">{{ '⚠' if cat == 'error' else '✔' }}</span><span>{{ m }}</span>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
